services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dao
      POSTGRES_USER: dao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dao}
    ports:
      - "5432:5432"
    volumes:
      - dao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dao -d dao"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dao:${POSTGRES_PASSWORD:-dao}@db:5432/dao
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET:-}
      TELEGRAM_OIDC_REDIRECT_URI: ${TELEGRAM_OIDC_REDIRECT_URI:-}
      DEFAULT_MEMBERSHIP_STATUS: ${DEFAULT_MEMBERSHIP_STATUS:-candidate}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-true}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dao_node_modules:/app/node_modules
    command: sh -c "npm run db:migrate && npm run dev -- --hostname 0.0.0.0"

volumes:
  dao_pgdata:
  dao_node_modules:
